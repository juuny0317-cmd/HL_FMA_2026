# HL 만도 건국대 시험 TUI 설정.
# 경로 좌표를 축소하지 않는다. 시험장 경로 조각을 회전/평행이동한 뒤 아래
# 파일명과 건국대 ENU 시작 위치/방향을 맞춘다. relaxed 모드는 정합값을
# 정보로만 표시하며 RTK FIXED는 계속 확인한다. MCAP은 B 키로 필요할 때만 기록한다.
# Course 07 전체와 캠퍼스 조각의 공통 원본은 course_07_mission.csv이며,
# source_variant_id로 P/T/F 형상을 선택하고 원본 s 구간을 잘라 쓴다.
version: 1

common:
  system_config: ../ros2_ws/src/hl_ku_core/config/system.yaml
  gps_config: ../ros2_ws/src/hl_ku_core/config/gps_only_route.yaml
  receiver_config: ../ros2_ws/src/hl_ku_core/config/rtk_field_test.yaml
  ntrip_config: ../ros2_ws/src/hl_ku_core/config/ntrip_private.yaml
  recording_script: ./record_all_topics.sh
  finger_drive_script: ./run_finger_drive.sh
  log_directory: ../logs/mando_tui
  camera_device: /dev/v4l/by-id/usb-046d_C270_HD_WEBCAM_200901010001-video-index0
  # MCAP은 선택 기록이다. B를 누르면 시작/종료되며 꺼져 있어도 주행할 수 있다.
  require_recording: false
  # 장착/지도 투영/후보 경로 현장 검증을 모두 끝낸 뒤에만 true로 변경한다.
  enable_local_detour_steering: false

scenarios:
  - number: 1
    name: 직선
    kind: route
    default_pwm: 30
    variants:
      - name: 직선 5-10m
        segment_code: STRAIGHT-8M
        fsm_label: ROUTE
        direction_summary: 전진 8.0m
        footprint: 7.75×0.15m
        run_summary: 짧은 직선에서 위치·CTE·Stanley 조향 비교
        description: 원본 course_07 · s=44.0~52.0m · 약 7.75m 직선 · scale 1.0
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/konkuk_straight.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/konkuk_straight_calibration.yaml
        # 파일이 없거나 datum이 바뀌면 현재 RTK ENU 위치·방향에 시험장 원본
        # s=44~52m를 회전/평행이동한다. 길이와 곡률 스케일은 바꾸지 않는다.
        source_route: ../ros2_ws/src/hl_ku_core/routes/course_07_mission.csv
        source_variant_id: p1_t1_f1
        preserve_source_profile: true
        source_start_s_m: 44.0
        source_length_m: 8.0
        auto_place_at_current_pose: true
        preflight: relaxed
        start_position_tolerance_m: 0.50
        start_heading_tolerance_deg: 10.0
        minimum_length_m: 7.0
        maximum_length_m: 9.0

  - number: 2
    name: 곡선
    kind: route
    default_pwm: 25
    variants:
      - name: 곡선 단일구간
        segment_code: CURVE-L8M
        fsm_label: ROUTE
        direction_summary: 전진 8.0m
        footprint: 6.73×2.72m
        run_summary: 약 53.5도 좌곡선에서 위치·CTE·Stanley 조향 비교
        description: 원본 course_07 · s=77.7~85.7m · 약 7.56m 좌곡선 53.5deg · scale 1.0
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/konkuk_curve.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/konkuk_curve_calibration.yaml
        # 원본 s=77.7~85.7m의 약 53도 좌곡선을 현재 RTK pose에 배치한다.
        # 회전/평행이동만 하며 원본 길이와 곡률 스케일은 유지한다.
        source_route: ../ros2_ws/src/hl_ku_core/routes/course_07_mission.csv
        source_variant_id: p1_t1_f1
        preserve_source_profile: true
        source_start_s_m: 77.7
        source_length_m: 8.0
        auto_place_at_current_pose: true
        preflight: relaxed
        start_position_tolerance_m: 0.50
        start_heading_tolerance_deg: 10.0
        minimum_length_m: 7.0
        maximum_length_m: 9.0

  - number: 3
    name: 통합 미션 · 전체코스/S자/T주차
    kind: route
    default_pwm: 30
    variant_defaults:
      source_route: ../ros2_ws/src/hl_ku_core/routes/course_07_mission.csv
      source_variant_id: p1_t1_f1
      preserve_source_profile: true
      auto_place_at_current_pose: true
      preflight: relaxed
      start_position_tolerance_m: 0.50
      start_heading_tolerance_deg: 10.0
    variants:
      - name: 전체 코스 · 주차 자동선택 · F1
        segment_code: COURSE-07
        direction_summary: 전 코스 · 전진/후진 포함
        run_summary: T주차에서 T1/T2, 평행주차에서 P1/P2를 라이다로 자동 선택
        description: 원본 0~약 696m · P1/T1 기본 · 미확인/둘 다 막힘은 1번 계속 주행
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/course_07_full_p1_t1_f1.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/course_07_full_p1_t1_f1_calibration.yaml
        source_variant_id: p1_t1_f1
        source_start_s_m: 0.0
        source_length_m: 700.0
        minimum_length_m: 690.0
        maximum_length_m: 705.0
        allow_reverse: true
        enable_parking_selection: true
        enable_camera_perception: true
        enable_yolo_perception: true
      - name: 전체 코스 · 주차 자동선택 · F2
        segment_code: COURSE-07
        direction_summary: 전 코스 · 전진/후진 포함
        run_summary: T주차에서 T1/T2, 평행주차에서 P1/P2를 라이다로 자동 선택
        description: 원본 0~약 696m · P1/T1 기본 · 미확인/둘 다 막힘은 1번 계속 주행
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/course_07_full_p1_t1_f2.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/course_07_full_p1_t1_f2_calibration.yaml
        source_variant_id: p1_t1_f2
        source_start_s_m: 0.0
        source_length_m: 700.0
        minimum_length_m: 690.0
        maximum_length_m: 705.0
        allow_reverse: true
        enable_parking_selection: true
      - name: 전체 코스 P1/T2/F1
        segment_code: COURSE-07
        direction_summary: 전 코스 · 전진/후진 포함
        run_summary: CSV의 미션 구역·이벤트·주차 방향을 모두 순서대로 추종
        description: 원본 0~약 699m · P1/T2/F1 경로 조합
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/course_07_full_p1_t2_f1.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/course_07_full_p1_t2_f1_calibration.yaml
        source_variant_id: p1_t2_f1
        source_start_s_m: 0.0
        source_length_m: 700.0
        minimum_length_m: 690.0
        maximum_length_m: 705.0
        allow_reverse: true
      - name: 전체 코스 P1/T2/F2
