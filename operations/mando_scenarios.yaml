        allow_reverse: true
      - name: S자 전체 · 진입부터 탈출까지
        segment_code: S-FULL
        fsm_label: S_CURVE
        direction_summary: 전진 37.67m
        footprint: 20.83×22.40m
        run_summary: S자 전체 Stanley 경로 추종 · 장애물 회피 미사용
        description: S_CURVE 정확한 전체 경계 · 원본 s=191.386~229.060m · 37.67m · scale 1.0
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/seg_s_full.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/seg_s_full_calibration.yaml
        source_route: ../ros2_ws/src/hl_ku_core/routes/course_07_mission.csv
        source_variant_id: p1_t1_f1
        source_start_s_m: 191.3864
        source_length_m: 37.6734
        mission_override: S_OBSTACLE
        enable_lidar_detour: false
      - name: T자 주차 1번 · 전체 동작
        segment_code: T1-FULL
        fsm_label: T_PARK
        direction_summary: 전진 18.28m → 후진 10.25m → 전진 15.80m
        footprint: 17.36×8.21m
        run_summary: T1 진입·후진주차·전진복귀 전체를 방향 전환마다 0.75초 정지 후 연속 추종
        description: T_PARK 1번 전체 · 원본 s=284.866~329.397m · 44.53m · F→R→F · scale 1.0
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/seg_t1_full.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/seg_t1_full_calibration.yaml
        source_route: ../ros2_ws/src/hl_ku_core/routes/course_07_mission.csv
        source_variant_id: p1_t1_f1
