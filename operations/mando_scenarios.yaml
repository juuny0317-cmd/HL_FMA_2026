        source_length_m: 700.0
        minimum_length_m: 690.0
        maximum_length_m: 705.0
        allow_reverse: true
      - name: 전체 코스 P2/T1/F2
        segment_code: COURSE-07
        direction_summary: 전 코스 · 전진/후진 포함
        run_summary: CSV의 미션 구역·이벤트·주차 방향을 모두 순서대로 추종
        description: 원본 0~약 696m · P2/T1/F2 경로 조합
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/course_07_full_p2_t1_f2.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/course_07_full_p2_t1_f2_calibration.yaml
