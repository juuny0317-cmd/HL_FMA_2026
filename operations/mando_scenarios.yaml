        description: 원본 0~약 698m · P1/T2/F2 경로 조합
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/course_07_full_p1_t2_f2.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/course_07_full_p1_t2_f2_calibration.yaml
