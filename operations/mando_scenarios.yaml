        description: 원본 0~약 699m · P2/T2/F1 경로 조합
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/course_07_full_p2_t2_f1.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/course_07_full_p2_t2_f1_calibration.yaml
        source_variant_id: p2_t2_f1
        source_start_s_m: 0.0
        source_length_m: 700.0
        minimum_length_m: 690.0
        maximum_length_m: 705.0
        allow_reverse: true
      - name: 전체 코스 P2/T2/F2
        segment_code: COURSE-07
        direction_summary: 전 코스 · 전진/후진 포함
        run_summary: CSV의 미션 구역·이벤트·주차 방향을 모두 순서대로 추종
        description: 원본 0~약 698m · P2/T2/F2 경로 조합
        route_file: ../ros2_ws/src/hl_ku_core/routes/mando/course_07_full_p2_t2_f2.csv
        calibration_file: ../ros2_ws/src/hl_ku_core/config/mando/course_07_full_p2_t2_f2_calibration.yaml
