        allow_reverse: true
        direction_change_hold_sec: 0.75
  - number: 4
    name: 손가락 주행
    kind: finger
    # 숫자는 W/S를 한 번 누를 때마다 더하고 빼는 PWM 단위다.
    default_pwm: 10
    maximum_pwm: 100

  - number: 5
    name: 건대 기준좌표
    kind: datum
    # V 키로 10~3600초 범위에서 바꿀 수 있다.
    duration_sec: 120
    minimum_samples: 100
    maximum_hdop: 2.5

  # 6~9는 course_07 전체를 FSM 경계와 주행 형상에 맞춰 나눈 목록이다.
